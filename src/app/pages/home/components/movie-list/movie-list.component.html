<div>
    <ul>
        <li *ngFor="let movie of movies"  >
            <app-movie-card 
                [title]="movie.title" 
                [overview]="movie.overview" 
                [id]="movie.id"
                [routerLink]="['/movie', movie.id]"> 
            </app-movie-card>
        </li>
    </ul>
</div>
