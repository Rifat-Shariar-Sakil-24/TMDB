<section class="movie-list-section">
  <h2 class="section-title">Popular Movies</h2>
  <div class="movie-list-container">
    <div class="movies-grid">
      <app-movie-card 
        *ngFor="let movie of movies" 
        [movie]="movie"
        [routerLink]="['/movie', movie.id]">
      </app-movie-card>
    </div>
  </div>
</section>
